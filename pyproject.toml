[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "framebucket-data"
version = "0.2.0"
description = "FrameBucket gallery and photo-processing microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "boto3>=1.35,<2",
    "google-api-python-client>=2.150,<3",
    "google-auth>=2.35,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10.4,<13",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.12",
    "rawpy>=0.22",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ai = ["onnxruntime>=1.19,<2"]

[project.scripts]
fb-data-local = "app.cli:main"
fb-data-worker = "app.worker:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql", "assets/fonts/*"]
