name: Tests

# Runs the data-service test suite (gallery, album auto-design, layered PSDs, wedding invitations incl.
# the MP4 render, editing style, HTTP routes) against a real PostgreSQL, then checks the Docker image
# still builds. Runs on every push and pull request; can also be started by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fb_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system packages (ffmpeg for invitation videos, text shaping for Indian scripts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libfribidi0 libharfbuzz0b

      - name: Install the service and test tools
        run: pip install ".[test]"

      - name: Run tests
        run: pytest --junitxml=test-results.xml

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-service-test-results
          path: test-results.xml
          retention-days: 14

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=data-ci
          cache-to: type=gha,mode=max,scope=data-ci
